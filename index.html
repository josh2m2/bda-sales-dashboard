<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDA Sales Dashboard — July 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f0ff;
      color: #111;
      min-height: 100vh;
      padding: 48px 20px 80px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7c3aed;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 42px;
      font-weight: 900;
      color: #0f0a1e;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    .header .sub {
      font-size: 15px;
      color: #6b7280;
      max-width: 420px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── TOGGLE ── */
    .toggle-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .toggle-bar {
      display: inline-flex;
      gap: 4px;
      background: #e9e4f9;
      padding: 4px;
      border-radius: 100px;
    }
    .toggle-btn {
      padding: 8px 22px;
      border: none;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #7c3aed;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .toggle-btn.active {
      background: #7c3aed;
      color: #fff;
      box-shadow: 0 2px 8px rgba(124,58,237,0.3);
    }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: #9ca3af;
      font-weight: 500;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-scorecard { background: #7c3aed; }

    /* ── MAIN CARD ── */
    .table-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(124,58,237,0.08), 0 1px 4px rgba(0,0,0,0.04);
      border: 1px solid rgba(124,58,237,0.1);
    }

    /* Column header row */
    .col-head {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      column-gap: 16px;
      padding: 14px 24px;
      background: #faf8ff;
      border-bottom: 1px solid #ede9fe;
    }
    .col-head span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a78bfa;
    }
    .col-head span:not(:first-child) { text-align: center; }

    /* Section header — base */
    .section-hd {
      padding: 10px 24px 9px;
      border-top: 1px solid;
      border-bottom: 1px solid;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-hd span {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .section-hd::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Section colours */
    .section-hd.blue   { background: #eff6ff; border-color: #dbeafe; }
    .section-hd.blue   span { color: #1d4ed8; }
    .section-hd.blue::before { background: #3b82f6; }

    .section-hd.orange { background: #fff7ed; border-color: #fed7aa; }
    .section-hd.orange span { color: #c2410c; }
    .section-hd.orange::before { background: #f97316; }

    .section-hd.purple { background: #faf8ff; border-color: #ede9fe; }
    .section-hd.purple span { color: #7c3aed; }
    .section-hd.purple::before { background: #7c3aed; }

    /* Metric row */
    .mrow {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      column-gap: 16px;
      padding: 11px 24px;
      border-bottom: 1px solid #f5f3ff;
      align-items: center;
      transition: background 0.1s;
    }
    .mrow:last-child { border-bottom: none; }
    .mrow:hover { background: #fdf9ff; }

    .mlabel {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: #374151;
    }
    .mval {
      text-align: center;
      font-size: 13px;
      font-weight: 400;
      color: #c0c8d4;
      font-variant-numeric: tabular-nums;
    }
    .mval.flat { color: #c0c8d4; }
    .mval.mtd {
      font-size: 15px;
      font-weight: 700;
      color: #0f0a1e;
    }
    .mval.mtd.flat { color: #374151; }
    .mval.up   { color: #059669; }
    .mval.down { color: #dc2626; }
    .mval.na   { color: #d1d5db; font-size: 13px; }

    /* Sub-divider */
    .subdiv {
      height: 1px;
      background: #ede9fe;
      margin: 0 24px;
    }

    /* Footer note */
    .fnote {
      font-size: 11px;
      color: #c4b5fd;
      padding: 12px 24px 14px;
      border-top: 1px solid #f5f3ff;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="chip">🐶 Budget Dog · LTA</div>
    <h1>Sales Team Dashboard</h1>
    <p class="sub">Compare this month's performance against the 6-month average. Source: Scorecard.</p>
  </div>

  <div class="toggle-wrap">
    <div class="toggle-bar">
      <button class="toggle-btn active" data-view="f2f">F2F</button>
      <button class="toggle-btn"        data-view="6ff">6FF</button>
      <button class="toggle-btn"        data-view="combined">Combined</button>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <span class="dot dot-scorecard"></span> Scorecard
    </div>
    <div class="legend-item" style="color:#059669;">▲ above 6MA</div>
    <div class="legend-item" style="color:#dc2626;">▼ below 6MA</div>
  </div>

  <div class="table-card">
    <div class="col-head">
      <span>Metric</span>
      <span id="ma-label">6-Month Average</span>
      <span>Jul MTD</span>
    </div>

    <div class="section-hd blue"><span>Front End</span></div>
    <div id="rows-fe"></div>

    <div class="section-hd orange"><span>Middle — Setter Layer</span></div>
    <div id="rows-mid"></div>

    <div class="section-hd purple"><span>Backend — Closer Layer</span></div>
    <div id="rows-be"></div>

    <p class="fnote" id="footnote"></p>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// DATA  (6MA = trailing 6-month average before MTD month)
// up  = higher MTD is better
// down = lower MTD is better
// flat = directional signal not meaningful (ad spend, spend-driven counts)
// na   = data not yet wired (placeholders)
// ─────────────────────────────────────────────────────────────────────────────

const VIEWS = {

  f2f: {
    maLabel: '6-Month Average',
    note: 'F2F 6MA = simple average of Jan–Jun 2026 (6 complete months).',
    fe: [
      { label: 'Ad spend',             ma: '$36,473', mtd: '$63,427', dir: 'flat' },
      { label: 'Sales page (visitors)',  ma: '14,124',  mtd: '20,044',  dir: 'up'   },
      { label: 'Opt-in rate',           ma: '5.6%',    mtd: '6.6%',    dir: 'up'   },
      { label: 'Checkout rate',         ma: '31.5%',   mtd: '42%',     dir: 'up'   },
      { label: 'LT buyers',             ma: '276',     mtd: '550',     dir: 'up'   },
      { label: 'LT cash',               ma: '$8,720',  mtd: '$19,197', dir: 'up'   },
      { label: 'LT calls booked %',     ma: '70.3%',   mtd: '70%',     dir: 'flat' },
      { label: 'LT calls booked',       ma: '219',     mtd: '387',     dir: 'up'   },
    ],
    mid: [
      { label: 'Show rate',             ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'No-show rate',          ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Cancellation rate',     ma: '—',       mtd: '—',       dir: 'na'   },
      { divider: true },
      { label: 'Qualified %',           ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Booked-to-close rate',  ma: '—',       mtd: '—',       dir: 'na'   },
    ],
    be: [
      { label: 'Show rate',             ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'No-show rate',          ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Cancellation rate',     ma: '—',       mtd: '—',       dir: 'na'   },
      { divider: true },
      { label: 'Closes',                ma: '18',      mtd: '11',      dir: 'up'   },
      { label: 'Close rate',            ma: '13.7%',   mtd: '13%',     dir: 'flat' },
      { label: 'Total cash collected',  ma: '$131,850',mtd: '$100,147',dir: 'up'   },
    ],
  },

  '6ff': {
    maLabel: '6-Month Average*',
    note: '* 6FF 6MA uses Jan / Feb / Mar / Jun only — Apr & May data not in scorecard.',
    fe: [
      { label: 'Ad spend',              ma: '$29,133', mtd: '$20,457', dir: 'flat' },
      { label: 'Sales page (visitors)', ma: '10,255',  mtd: '9,107',   dir: 'up'   },
      { label: 'Opt-in rate',           ma: '8.1%',    mtd: '8.1%',    dir: 'flat' },
      { label: 'Checkout rate',         ma: '34%',     mtd: '35%',     dir: 'up'   },
      { label: 'LT buyers',             ma: '290',     mtd: '257',     dir: 'up'   },
      { label: 'LT cash',               ma: '$12,220', mtd: '$8,584',  dir: 'up'   },
      { label: 'LT calls booked %',     ma: '45%',     mtd: '56%',     dir: 'up'   },
      { label: 'LT calls booked',       ma: '125',     mtd: '144',     dir: 'up'   },
    ],
    mid: [
      { label: 'Show rate',             ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'No-show rate',          ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Cancellation rate',     ma: '—',       mtd: '—',       dir: 'na'   },
      { divider: true },
      { label: 'Qualified %',           ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Booked-to-close rate',  ma: '—',       mtd: '—',       dir: 'na'   },
    ],
    be: [
      { label: 'Show rate',             ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'No-show rate',          ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Cancellation rate',     ma: '—',       mtd: '—',       dir: 'na'   },
      { divider: true },
      { label: 'Closes',                ma: '10',      mtd: '3',       dir: 'up'   },
      { label: 'Close rate',            ma: '18.8%',   mtd: '14%',     dir: 'up'   },
      { label: 'Total cash collected',  ma: '$86,951', mtd: '$33,584', dir: 'up'   },
    ],
  },

  combined: {
    maLabel: '6-Month Average*',
    note: '* Combined 6MA uses Jan / Feb / Mar / Jun only — 6FF data unavailable for Apr & May.',
    fe: [
      { label: 'Ad spend',              ma: '$78,779', mtd: '$83,884', dir: 'flat' },
      { label: 'Sales page (visitors)', ma: '28,289',  mtd: '29,151',  dir: 'up'   },
      { label: 'Opt-in rate',           ma: '6.4%',    mtd: '7.0%',    dir: 'up'   },
      { label: 'Checkout rate',         ma: '35%',     mtd: '39%',     dir: 'up'   },
      { label: 'LT buyers',             ma: '659',     mtd: '807',     dir: 'up'   },
      { label: 'LT cash',               ma: '$23,672', mtd: '$27,781', dir: 'up'   },
      { label: 'LT calls booked %',     ma: '64%',     mtd: '66%',     dir: 'up'   },
      { label: 'LT calls booked',       ma: '431',     mtd: '531',     dir: 'up'   },
    ],
    mid: [
      { label: 'Show rate',             ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'No-show rate',          ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Cancellation rate',     ma: '—',       mtd: '—',       dir: 'na'   },
      { divider: true },
      { label: 'Qualified %',           ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Booked-to-close rate',  ma: '—',       mtd: '—',       dir: 'na'   },
    ],
    be: [
      { label: 'Show rate',             ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'No-show rate',          ma: '—',       mtd: '—',       dir: 'na'   },
      { label: 'Cancellation rate',     ma: '—',       mtd: '—',       dir: 'na'   },
      { divider: true },
      { label: 'Closes',                ma: '35',      mtd: '14',      dir: 'up'   },
      { label: 'Close rate',            ma: '15.9%',   mtd: '13%',     dir: 'up'   },
      { label: 'Total cash collected',  ma: '$274,699',mtd: '$133,731',dir: 'up'   },
    ],
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────

function renderSection(id, rows) {
  const el = document.getElementById(id);
  el.innerHTML = '';

  rows.forEach(row => {
    if (row.divider) {
      const d = document.createElement('div');
      d.className = 'subdiv';
      el.appendChild(d);
      return;
    }

    const isUp   = row.dir === 'up'   && row.mtd !== '—';
    const isDown = row.dir === 'up'   && row.mtd === '—' ? false : false; // guard
    const mtdBetter = row.dir === 'up'   && compareBetter(row.mtd, row.ma) === 1;
    const mtdWorse  = row.dir === 'up'   && compareBetter(row.mtd, row.ma) === -1;
    const mtdClass  = row.dir === 'na'   ? 'na'
                    : row.dir === 'flat' ? 'mval mtd flat'
                    : mtdBetter          ? 'mval mtd up'
                    : mtdWorse           ? 'mval mtd down'
                    :                     'mval mtd flat';

    const arrow = row.dir === 'na' || row.dir === 'flat' || row.mtd === '—' ? ''
                : mtdBetter ? '▲ '
                : mtdWorse  ? '▼ '
                : '';

    const r = document.createElement('div');
    r.className = 'mrow';
    r.innerHTML =
      '<div class="mlabel">' +
        '<span class="dot dot-scorecard"></span>' +
        row.label +
      '</div>' +
      '<div class="mval flat">' + row.ma + '</div>' +
      '<div class="' + (row.dir === 'na' ? 'mval na' : mtdClass) + '">' +
        arrow + row.mtd +
      '</div>';
    el.appendChild(r);
  });
}

// Returns 1 if a > b, -1 if a < b, 0 if equal (strips $, commas, %)
function compareBetter(a, b) {
  const clean = s => parseFloat(s.replace(/[$,%\s▲▼]/g,'').replace(/,/g,''));
  const na = clean(a), nb = clean(b);
  if (isNaN(na) || isNaN(nb)) return 0;
  return na > nb ? 1 : na < nb ? -1 : 0;
}

function setView(view) {
  const v = VIEWS[view];
  document.getElementById('ma-label').textContent = v.maLabel;
  document.getElementById('footnote').textContent = v.note;
  renderSection('rows-fe',  v.fe);
  renderSection('rows-mid', v.mid);
  renderSection('rows-be',  v.be);
}

// Toggle click handler
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    setView(this.dataset.view);
  });
});

// Initial render
setView('f2f');
</script>
</body>
</html>
